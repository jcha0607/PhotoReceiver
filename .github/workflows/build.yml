name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pyinstaller --onefile --windowed --name PhotoReceiver --collect-all pillow_heif app.py
      - uses: actions/upload-artifact@v4
        with:
          name: PhotoReceiver-windows
          path: dist/PhotoReceiver.exe

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: bash scripts/build_mac.sh
      - uses: actions/upload-artifact@v4
        with:
          name: PhotoReceiver-macos
          path: dist/PhotoReceiver.dmg

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            PhotoReceiver.exe
            PhotoReceiver.dmg
