name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/write_build_info.py
        env:
          BUILD_COMMIT: ${{ github.sha }}
      - run: pyinstaller --onefile --windowed --name PhotoReceiver --collect-all pillow_heif app.py
      - run: python scripts/make_manifest.py win dist/PhotoReceiver.exe dist/update-win.json
      - uses: actions/upload-artifact@v4
        with:
          name: PhotoReceiver-windows
          path: |
            dist/PhotoReceiver.exe
            dist/update-win.json

  # main 푸시 시 'latest' 릴리스의 exe를 갱신한다 (DMG는 로컬 pre-push 훅이 올린다)
  publish:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: PhotoReceiver-windows
      - run: |
          gh release view latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create latest --repo "$GITHUB_REPOSITORY" --title "Latest build" --notes "main 브랜치 최신 빌드"
          gh release upload latest PhotoReceiver.exe --repo "$GITHUB_REPOSITORY" --clobber
          gh release upload latest update-win.json --repo "$GITHUB_REPOSITORY" --clobber
